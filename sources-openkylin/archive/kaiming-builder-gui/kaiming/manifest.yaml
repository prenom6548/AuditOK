standards-version: 1
source: kaiming-builder-gui
version: 1.0.0-ok1k0.15
build-depends:
  deb:
    - pkg-config
    - qtbase5-dev
    - qt5-qmake
    - qtchooser
    - qtscript5-dev
    - qttools5-dev-tools
    - qtbase5-dev-tools
    - qtbase5-private-dev
    - libkf5windowsystem-dev
    - libx11-dev
    - libqt5x11extras5-dev
    - libgsettings-qt-dev
    - libyaml-cpp-dev
    - patchelf
buildsystem: qmake
post-build: |
  # 调用脚本收集二进制依赖库
  mkdir -p $INSTALL_ROOT/opt/kaiming-tools/lib/kaiming-builder-gui
  # 进行依赖复制和rpath设置
  ./shells/bundle_dependencies_ok.sh
packages:
  - id: cn.kylin.kaiming-builder-gui
    name: kaiming-builder-gui
    description: Kaiming package construction tool.
