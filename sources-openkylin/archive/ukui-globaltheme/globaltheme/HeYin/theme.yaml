# 和印主题
xibowen:
  4.10.0.1:
    children:

# color-schemes
      color-schemes:
        keys:
          defaultLightDarkMode:
            _type: s
            default: dark
          supportLightDarkMode:
            _type: s
            default: true

# effect
      effect:
        keys:
          animationDuration:
            _type: s
            default: 150
          blurEnabled:
            _type: s
            default: true
          supportAnimation:
            _type: s
            default: true
          supportBlur:
            _type: s
            default: true
          supportTransparency:
            _type: s
            default: true
          transparencyBlur:
            _type: s
            default: 75
          transparencyNoBlur:
            _type: s
            default: 90
          windowRadius:
            _type: s
            default: 12,8

# generic
      generic:
        keys:
          Name[zh_CN]:
            _type: s
            default: 和印

# gtk
      gtk:
        keys:
          accent:
            _type: s
            default: #6A287E
          darkThemeName:
            _type: s
            default: ukui-black
          lightThemeName:
            _type: s
            default: ukui-white
          themeName:
            _type: s
            default: ukui-white

# qt
      qt:
        keys:
          accentRole:
            _type: s
            default: jamPurple
          darkThemeName:
            _type: s
            default: ukui-dark
          lightThemeName:
            _type: s
            default: ukui-light
          widgetThemeName:
            _type: s
            default: fashion

# wallpaper
      wallpaper:
        keys:
          wallPaperPath:
            _type: s
            default: /usr/share/backgrounds/heyin.png

# xdg
      xdg:
        keys:
          cursorThemeName:
            _type: s
            default: DMZ-White
          iconThemeName:
            _type: s
            default: ukui-icon-theme-fashion
          soundThemeName:
            _type: s
            default: HeYin
