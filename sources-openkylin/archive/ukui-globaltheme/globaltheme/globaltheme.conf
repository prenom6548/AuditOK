; global theme-color config. use RGBA format
[theme-color]
kbrand1="55,144,250,1"
kbrand2="120,115,245,1"
kbrand3="228,74,232,1"
kbrand4="242,181,39,1"
kbrand5="20,166,33,1"
kbrand6="240,73,67,1"
kbrand7="250,125,15,1"
kbrand8="6,192,199,1"
;kbrand8="54,118,245,1"

; global window-radius config. The first represents regular window corner, and second represents menu and tooltip radius
[window-radius]
bigRadius="12,8"
mediumRadius="6,4"
noRadius="0,0"

; system transparency range
[transparency]
transparency="0.35,1"

