# 寻光主题
xibowen:
  4.10.0.1:
    children:

# color-schemes
      color-schemes:
        keys:
          defaultLightDarkMode:
            _type: s
            default: light
          supportLightDarkMode:
            _type: s
            default: true

# effect
      effect:
        keys:
          animationDuration:
            _type: s
            default: 150
          blurEnabled:
            _type: s
            default: true
          supportAnimation:
            _type: s
            default: true
          supportBlur:
            _type: s
            default: true
          supportTransparency:
            _type: s
            default: true
          transparencyBlur:
            _type: s
            default: 65
          transparencyNoBlur:
            _type: s
            default: 90
          windowRadius:
            _type: s
            default: 12,8

# generic
      generic:
        keys:
          Name[zh_CN]:
            _type: s
            default: 寻光

# gtk
      gtk:
        keys:
          accent:
            _type: s
            default: #3790FA
          darkThemeName:
            _type: s
            default: ukui-black
          lightThemeName:
            _type: s
            default: ukui-white
          themeName:
            _type: s
            default: ukui-white

# qt
      qt:
        keys:
          accentRole:
            _type: s
            default: daybreakBlue
          darkThemeName:
            _type: s
            default: ukui-dark
          lightThemeName:
            _type: s
            default: ukui-light
          widgetThemeName:
            _type: s
            default: default

# wallpaper
      wallpaper:
        keys:
          wallPaperPath:
            _type: s
            default: /usr/share/backgrounds/1-openkylin.jpg

# xdg
      xdg:
        keys:
          cursorThemeName:
            _type: s
            default: dark-sense
          iconThemeName:
            _type: s
            default: ukui-icon-theme-default
          soundThemeName:
            _type: s
            default: Light-Seeking
