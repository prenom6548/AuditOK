syntax = "proto2";

message ScreenManageMsg {
    enum MessageType {
        CURTAINREADY = 0;
        SCREENREADY = 1;
        CURTAINEXIT = 2;
        SCREENEXIT = 3;
        REFUSE = 4;
        STARTEDCONTROL = 5;
        EXITCONTROL = 6;
    }
    required MessageType msg = 1;
    optional string  roomid = 2;
}

