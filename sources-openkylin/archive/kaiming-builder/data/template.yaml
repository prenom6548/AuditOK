# yaml模板中不必要的可删除，如需添加其他属性请查看清单规范
# 清单规范版本号，不要修改
version: "1"
# 包信息
package:
  # 应用id 具有唯一性
  id: @id@
  # 应用名
  name: ${请替换}
  # 应用版本号
  version: ${请替换}
  # 应用类型，如：app/base/runtime/depend，默认app
  kind: app
  # 应用描述
  description: |
    ${请替换}
# 应用程序使用的基础环境信息。格式：${base-channel}:${base-id}/${base-version}，如：stable:top.openkylin.base/1.0.0
# 可以使用命令：kaiming search --kind=base查看开明源中提供的base
base: stable:top.openkylin.base/1.0.0
# 应用程序使用的运行时信息，格式：${runtime-channel}:${runtime-id}/${runtime-version} ,如：stable:top.openkylin.ukui/1.0.0
# 可以使用命令：kaiming search --kind=runtime查看开明源中提供的runtime
runtime: stable:top.openkylin.ukui/1.0.0
# depends属性用于指定在base、runtime中没有提供的功能所在包。如果没有额外依赖则删除此属性。
# 依赖列表。数组类型，每个成员格式：${依赖id}/${依赖version}，依赖包版本${version}可不指定。
# 可用使用命令查看提供的依赖包：kaiming search --kind=depend [id]。
depends:
  - ${请替换}
# 发布渠道, 默认stable
channel: stable
# 拆包模块，默认只binary包。
modules: 
  binary: ".*"
# 数组类型。应用程序启动命令，kind=app时必须设置，格式：
#  - 程序名
#  - 参数1
#  - 参数2
#  - ...
command: 
  - ${请替换}
# 构建组件列表
components:
  # 组件名称,用于识别不同的组件
  - name: ${请替换}
    # 构建系统，使用autotools，cmake，cmake-ninja，meson，qmake，simple，不设置则默认为autotools;
    # simple为自定义构建、安装行为的方式; 不能使用autotools，cmake，cmake-ninja，meson，qmake的都可以使用simple方式自定义构建、安装。
    buildsystem: ${请替换}
    # buildsystem=simple时，需要使用 build-script自定义构建、安装行为
    # build-script: |
    #  ${请使用自定义的构建、安装shell脚本替换，如：./configure --prefix=${APP_INSTALL_PREFIX} && make -j8 && make install}
    # 源码获取方式列表，可以从下面类型中设置一种或多种源码的获取方式，其他的删除
    sources:
      # archive包含.tar.gz、.tar.bz2、.tar.xz、.zip
      - type: archive
        # 存档的本地路径, 注：path是相对当前配置文件的相对路径
        # path: ${请替换}
        # 将要下载的远程存档的URL。如果同时指定了path，则此选项将覆盖path。支持http,https,ftps协议，不支持files://。
        url: ${请替换}
        # 文件的sha256校验和，下载后验证,sha256与sha512必须存在一个，建议使用sha256
        sha256: ${请替换}

      - type: git
        # git存储库的URL
        url: ${请替换}
        # git存储库中要使用的提交
        commit: ${请替换}

      - type: file
        # 将被复制到源目录中的本地文件的路径, 注：path是相对当前配置文件的相对路径
        path: ${请替换}

      - type: dir
        # 本地目录的路径，其内容将被复制到源目录中, 注：path是相对当前配置文件的相对路径。
        path: ${请替换}
# 权限设置
permission:
  # 文件系统权限
  filesystem:
    # 是否挂载宿主机上的xdg目录，包括：桌面、下载、音乐、视频、文档等，默认不挂载
    xdg-user-dirs: false
    # 额外需要挂载宿主机目录到容器内
    # filesystem-dirs:
    #   - "~"
