standards-version: 1
source: kaiming-builder
version: 1.0.0-ok1k0.17
build-depends:
  deb:
    - pkg-config
    - cmake
    - libyaml-cpp-dev
    - nlohmann-json3-dev
    - libssl-dev
    - patchelf
buildsystem: cmake
post-build: |
  # 调用脚本收集二进制依赖库
  # mkdir -p kaiming/kaiming-builder/files/opt/kaiming-tools/lib/
  mkdir -p $DESTDIR/opt/kaiming-tools/lib/
  # 进行依赖复制和rpath设置
  ./shells/bundle_dependencies_ok.sh
packages:
  - id: cn.kylin.kaiming-builder
    name: kaiming-builder
    description: Kaiming package construction tool.
