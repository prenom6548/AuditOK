version: 1
package:
  id: top.openkylin.kylin-ipmsg
  name: kylin-ipmsg
  version: 1.3.1.2-ok16.15k0.28
  kind: app
command:
  - kylin-ipmsg
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  net:
    network: true
  device:
    usb: true
base: stable:top.openkylin.base/1
runtime: stable:top.openkylin.ukui/1
depends:
  - depend.openkylin.libpeony-dev
  - depend.openkylin.libkf5windowsystem-dev
cleanup:
  []
annotations:
  kylin.depend-apps:
    - /usr/bin/kylin-screenshot
    - /usr/bin/peony
    - /usr/bin/tar
    - /usr/bin/xdg-open
    - /usr/bin/uuidgen
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
components:
  - name: ipmsg
    buildsystem: simple
    build-script: "test -f data/kylin-ipmsg.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.kylin-ipmsg/files/bin/kylin-ipmsg#' data/kylin-ipmsg.desktop  && echo \\\"替换成功\\\" || echo \\\"错误:文件不存在或替换失败\\\" &&qmake kylin-ipmsg.pro  CONFIG+=KAIMING   && make -j 2 && make install   && glib-compile-schemas /opt/apps/top.openkylin.kylin-ipmsg/files/share/glib-2.0/schemas/ "
    sources:
      - type: dir
        path: ../
