# vendor.id = 0bda product.id = 4987
# Front Mic = device:0
# Rear Mic = device:1
# Line in = device:2
# 输出默认模拟耳机、数字输出端口一直存在

[General]
auto-profiles = yes

[Mapping analog-stereo-headphone]
description = Headphone
paths-output = analog-output-headphones
device-strings = hw:%f,0
channel-map = left,right
direction = output

[Mapping mono-fallback-front-mic]
description = Front Microphone
paths-input = analog-input analog-input-front-mic
device-strings = hw:%f,0
channel-map = mono
direction = input

[Mapping analog-stereo-rear-mic]
description = Rear Microphone
paths-input = analog-input analog-input-rear-mic
device-strings = hw:%f,1
channel-map = left,right
direction = input

[Mapping analog-stereo-linein]
description = Linein
paths-input = analog-input analog-input-linein
device-strings = hw:%f,2
channel-map = left,right
direction = input
