version: 1
package:
  id: top.openkylin.ukui-clock
  name: ukui-clock
  version: 4.0.0.0-ok3.12k0.18
  kind: app
command:
  - ukui-clock
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  net:
    network: true
    scanning: true
  device:
    bluetooth: true
    microphone: true
    camera: true
    usb: true
    serial: true
  processManager:
    autostart: true
  others:
    system-notice: true
    system-time: true
    system-server: true
    prevent-sleep: true
    system-display-resolution: true
    system-display-brightness: true
    system-audio-settings: true
    system-audio-size: true
    system-crontab: true
    system-power-mode: true
    system-power-policy: true
base: stable:top.openkylin.base/1.1.0
runtime: stable:top.openkylin.ukui/1.1.0
depends:
  - depend.openkylin.libkf5windowsystem-dev/5.92.0-ok5.3k0.1
  - depend.openkylin.libmpv-dev/0.32.0-4kylin6k18.2
cleanup:
  []
annotations:
  kylin.depend-apps:
    - /usr/bin/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
components:
  - name: ukui-clock
    buildsystem: simple
    build-script: "test -f ukui-clock.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.ukui-clock/files/bin/ukui-clock#'  ukui-clock.desktop  && echo \"替换成功\" || echo \"错误:文件不存在或替换失败\" &&\nqmake ukui-clock.pro CONFIG+=KAIMING && make -j 2 && make install "
    pre-install: "qmake ukui-clock.pro CONFIG+=KAIMING && make -j 2 && make install "
    sources:
      - type: dir
        path: .