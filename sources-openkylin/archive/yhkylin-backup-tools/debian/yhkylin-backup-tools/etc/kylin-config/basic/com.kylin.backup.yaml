com:kylin:backup:
  1.0.0.1:
    audit:
      _type: b
      _default: false
    whitelist:
      _type: as
      _default: '["/usr/bin/kylin-unattended-upgrade-shutdown","/usr/bin/ukui-control-center","/usr/share/kylin-system-updater/kylin-system-updater","/usr/bin/kybackup","/usr/bin/kybackupcli"]'
    backupstatus:
      systembackup:
        _type: b
        _default: 'true'
      systemrestore:
        _type: b
        _default: 'true'
      databackup:
        _type: b
        _default: 'true'
      datarestore:
        _type: b
        _default: 'true'
      ghostimage:
        _type: b
        _default: 'true'
    backuppointnummax:
      _type: i
      _default: '-1'
      _description: no limit when -1
