version: 1
package:
  id: top.openkylin.kylin-burner
  name: kylin-burner
  version: 3.2.0.1-kylin1k32.01-ok28k1.65
  kind: app
command:
  - kylin-burner
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  device:
    usb: true
    serial: true
base: stable:top.openkylin.base/1.1.13
runtime: stable:top.openkylin.ukui/1.1.42
depends:
  - depend.openkylin.libkf5wayland-dev
  - depend.openkylin.libkf5iconthemes-dev
  - depend.openkylin.libkf5windowsystem-dev
  - depend.openkylin.libzip-dev
annotations:
  kylin.depend-apps:
    - /usr/bin/umount
    - /usr/bin/eject
    - /usr/bin/peony
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
components:
  - name: kylin-burner
    buildsystem: cmake
    post-install: glib-compile-schemas /opt/apps/top.openkylin.kylin-burner/files/share/glib-2.0/schemas/
    sources:
      - type: dir
        path: ../
