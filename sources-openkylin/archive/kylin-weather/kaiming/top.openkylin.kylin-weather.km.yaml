version: 1
package:
  id: top.openkylin.kylin-weather
  name: kylin-weather
  version: 3.2.0.3-ok16.11k1.19
  kind: app
  description: kylin-weather
command:
  - kylin-weather
  - showmainwindow
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  net:
    network: true
  processManager:
    autostart: true
base: stable:top.openkylin.base/1.1.13
runtime: stable:top.openkylin.ukui/1.1.42
depends:
  - depend.openkylin.libgeoip-dev
  - depend.openkylin.libkf5windowsystem-dev
cleanup:
  []
annotations:
  kylin.depend-apps:
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
    - /usr/bin/ukui-control-center
components:
  - name: kylin-weather
    buildsystem: simple
    build-script: "test -f kylin-weather.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.kylin-weather/files/bin/kylin-weather#' kylin-weather.desktop  && echo \\\"替换成功1\\\" || echo \\\"错误:文件不存在或替换失败1\\\" &&test -f data/autostart/kylin-weather.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.kylin-weather/files/bin/kylin-weather noshowmainwindow#' data/autostart/kylin-weather.desktop  && echo \\\"替换成功2\\\" || echo \\\"错误:文件不存在或替换失败2\\\" &&qmake kylin-weather.pro  CONFIG+=KAIMING   && make -j 2 && make install   && glib-compile-schemas /opt/apps/top.openkylin.kylin-weather/files/share/glib-2.0/schemas/ "
    sources:
      - type: dir
        path: ../
