version: 1
package:
  id: top.openkylin.kylin-music
  name: kylin-music
  version: 1.1.0.47-ok9.25k0.27
  kind: app
  description: kylin-music
command:
  - kylin-music
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  net:
    network: true
    scanning: true
  device:
    bluetooth: true
    microphone: true
    camera: true
    usb: true
    serial: true
  processManager:
    autostart: true
  others:
    system-notice: true
    system-time: true
    system-server: true
    prevent-sleep: true
    system-display-resolution: true
    system-display-brightness: true
    system-audio-settings: true
    system-audio-size: true
    system-crontab: true
    system-power-mode: true
    system-power-policy: true
base: stable:top.openkylin.base/1.1.0
runtime: stable:top.openkylin.ukui/1.1.1
depends:
  - depend.openkylin.libkf5windowsystem-dev/5.92.0
  - depend.openkylin.libmpv-dev/0.32.0.4
  - depend.openkylin.libkf5wayland-dev/5.92.0
  - depend.openkylin.xorg-dev/7.7.0
  - depend.openkylin.libpeony-dev/4.10.0.5
cleanup:
  []
annotations:
  kylin.depend-apps:
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
components:
  - name: kylin-music
    buildsystem: simple
    build-script: "test -f kylin-music.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.kylin-music/files/bin/kylin-music %U#' kylin-music.desktop && echo \"替换成功\" || echo \"错误:文件不存在或替换失败\" && cd 3rdparty && cmake -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX:PATH=${APP_INSTALL_PREFIX} -DCMAKE_INSTALL_LIBDIR=${APP_INSTALL_PREFIX}/lib  ./ &&make -j${nproc} && make install && \ncd .. && qmake kylin-music.pro  CONFIG+=KAIMING   && make -j${nproc} && make install && \nglib-compile-schemas ${APP_INSTALL_PREFIX}/share/glib-2.0/schemas/"
    post-install: glib-compile-schemas /opt/apps/top.openkylin.kylin-music/files/share/glib-2.0/schemas/
    sources:
      - type: dir
        path: kaiming-bundles/kylin-music/kylin-music