version: 1
package:
  id: top.openkylin.kylin-recorder
  name: kylin-recorder
  version: 1.3.0.2-0k3.3-ok5.14k0.15
  kind: app
  description: kylin-recorder
command:
  - kylin-recorder
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  net:
    network: true
    scanning: true
  device:
    bluetooth: true
    microphone: true
    camera: true
    usb: true
    serial: true
  processManager:
    autostart: true
  others:
    system-notice: true
    system-time: true
    system-server: true
    prevent-sleep: true
    system-display-resolution: true
    system-display-brightness: true
    system-audio-settings: true
    system-audio-size: true
    system-crontab: true
    system-power-mode: true
    system-power-policy: true
base: stable:top.openkylin.base/1.1.0
runtime: stable:top.openkylin.ukui/1.1.0
depends:
  - depend.openkylin.libmp3lame-dev/3.100.0
  - depend.openkylin.libmpv-dev/0.32.0
  - depend.openkylin.libkf5windowsystem-dev/5.68.0
  - depend.openkylin.libpeony-dev/4.10.0.5
cleanup:
  []
components:
  - name: kylin-recorder
    buildsystem: simple
    build-script: "test -f kylin-recorder.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.kylin-recorder/files/bin/kylin-recorder#' kylin-recorder.desktop && echo "替换成功" || echo "错误:文件不存在或替换失败" && qmake kylin-recorder.pro CONFIG+=KAIMING && make -j 2 && make install"
    post-install: glib-compile-schemas /opt/apps/top.openkylin.kylin-recorder/files/share/glib-2.0/schemas/
    sources:
      - type: dir
        path: kaiming-bundles/kylin-recorder/kylin-recorder
annotations:
  kylin.depend-apps:
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini