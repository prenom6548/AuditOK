[package]
name = "kylin-time"
version = "1.9.0"
edition = "2021"
description = "GNU time utility rewritten in Rust - measure resource usage of programs"
authors = ["Rust rewrite of GNU time by David Keppel, David MacKenzie, Assaf Gordon"]

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
