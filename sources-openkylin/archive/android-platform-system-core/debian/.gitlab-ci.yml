pages:
  image: registry.salsa.debian.org/salsa-ci-team/ci-image-git-buildpackage:latest
  stage: deploy
  only:
    - master
  artifacts:
    paths:
      - public
    expire_in: 1 day
  except:
    - tags
  script:
    - gitlab-ci-add-pages-repo android-tools-team/android-platform-external-boringssl
    - gitlab-ci-add-pages-repo android-tools-team/android-platform-external-libselinux
    - gitlab-ci-add-pages-repo android-tools-team/android-platform-external-libunwind
    - gitlab-ci-git-buildpackage-all
    - gitlab-ci-aptly

# Google officially recommends android-tools-adb, for installing the
# udev rules, so we should keep it working until they update their
# recommendation: https://developer.android.com/studio/run/device.html
android-tools-adb_stable:
  image: debian:stable-slim
  stage: deploy
  only:
    - tags@android-tools-team/android-platform-system-core
  script:
    - apt-get -qy update
    - apt-get -qy install --install-recommends android-tools-adb
    - test -e /lib/udev/rules.d/51-android.rules

android-tools-adb_stretch-backports:
  image: debian:stretch-backports
  stage: deploy
  only:
    - tags@android-tools-team/android-platform-system-core
  script:
    - apt-get -qy update
    - apt-get -qy --target-release stretch-backports install --install-recommends android-tools-adb
    - test -e /lib/udev/rules.d/51-android.rules

android-tools-adb_testing:
  image: debian:testing-slim
  stage: deploy
  only:
    - master@android-tools-team/android-platform-system-core
  script:
    - apt-get -qy update
    - apt-get -qy install --install-recommends android-tools-adb
    - test -e /lib/udev/rules.d/51-android.rules

android-tools-adb_sid:
  image: debian:sid-slim
  stage: deploy
  only:
    - master@android-tools-team/android-platform-system-core
  script:
    - apt-get -qy update
    - apt-get -qy install --install-recommends android-tools-adb
    - test -e /lib/udev/rules.d/51-android.rules
