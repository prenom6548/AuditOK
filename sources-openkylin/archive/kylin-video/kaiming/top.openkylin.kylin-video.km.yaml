version: 1
package:
  id: top.openkylin.kylin-video
  name: video
  version: 3.1.4-2k1-ok26.21k0.84
  kind: app
command:
  - kylin-video
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  net:
    network: true
    scanning: true
  device:
    bluetooth: true
    microphone: true
    camera: true
    usb: true
    serial: true
  processManager:
    autostart: true
  others:
    system-notice: true
    system-time: true
    system-server: true
    prevent-sleep: true
    system-display-resolution: true
    system-display-brightness: true
    system-audio-settings: true
    system-audio-size: true
    system-crontab: true
    system-power-mode: true
    system-power-policy: true
base: stable:top.openkylin.base/1
runtime: stable:top.openkylin.ukui/1
depends:
  - depend.openkylin.libmpv-dev
  - depend.openkylin.libkf5windowsystem-dev
  - depend.openkylin.libkf5wayland-dev
  - depend.openkylin.libmpv1
  - depend.openkylin.libmediainfo-dev
  - depend.openkylin.libmediainfo0v5
cleanup:
  []
env:
  LD_LIBRARY_PATH: "/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH:/usr/lib/aarch64-linux-gnu/musa:/usr/lib/arm-linux-gnueabihf/musa:/usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu/musa:/usr/lib/sw_64-linux-gnu:/usr/lib/sw_64-linux-gnu/musa:/usr/lib/loongarch64-linux-gnu:/usr/lib/loongarch64-linux-gnu/musa:"
annotations:
  kylin.gpu: true
  kylin.depend-apps:
    - /usr/bin/peony
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
components:
  - name: kylin-video
    buildsystem: simple
    build-script: "test -f kylin-video.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.kylin-video/files/bin/kylin-video %U#' kylin-video.desktop && echo \"替换成功\" || echo \"错误:文件不存在或替换失败\" && qmake kylin-video.pro CONFIG+=KAIMING  && make -j 2 && make install"
    sources:
      - type: dir
        path: ..
