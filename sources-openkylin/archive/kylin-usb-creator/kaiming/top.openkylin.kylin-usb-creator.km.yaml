version: 1
package:
  id: top.openkylin.kylin-usb-creator
  name: kylin-usb-creator
  version: 1.2.0.3-ok6.13k0.63
  kind: app
command:
  - kylin-usb-creator
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
base: stable:top.openkylin.base/1.1.13
runtime: stable:top.openkylin.ukui/1.1.42
depends:
  - depend.openkylin.libkf5windowsystem-dev
  - depend.openkylin.libpolkit-qt5-1-1
  - depend.openkylin.libpolkit-qt5-1-dev
cleanup:
  []
annotations:
  kylin.depend-apps:
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
    - /usr/sbin/mkfs.fat
    - /usr/bin/mount
    - /usr/bin/umount
    - /usr/bin/md5sum
  kylin.gpu: true
  kylin.polkit: true
  kylin.desktop:
    - kylin-usb-creator.desktop
components:
  - name: kylin-usb-creator
    buildsystem: qmake
    sources:
      - type: dir
        path: ..
