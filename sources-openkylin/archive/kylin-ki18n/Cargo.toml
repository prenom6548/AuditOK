[package]
name = "kylin-ki18n"
version = "5.92.0"
edition = "2021"
license = "LGPL-2.0-or-later"
description = "Rust backend for KDE KI18n with C ABI compatibility"
authors = ["KI18n Rust Backend"]

[lib]
name = "ki18n_rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
lazy_static = "1.5"
parking_lot = "0.12"
regex = "1.11"
once_cell = "1.19"
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
unic-ucd = "0.9"
unic-emoji-char = "0.9"
chrono = { version = "=0.4.38", default-features = false, features = ["clock"] }
libc = "0.2"
quick-xml = "0.31"
boa_engine = "0.16"
unicode-normalization = "0.1.25"
sys-locale = "0.3"
indexmap = "=2.2.6"

[dev-dependencies]
serde_json = "1.0"
proptest = "=1.4.0"
tempfile = "=3.8.0"
getrandom = ">=0.2, <0.4"

# 链入 libKF5I18n.so 时减少 Rust 静态库中未引用目标的泄漏；配合 CMake -Wl,--gc-sections。
[profile.release]
lto = "thin"
codegen-units = 1

