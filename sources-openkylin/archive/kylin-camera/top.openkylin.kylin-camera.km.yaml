version: 1
package:
  id: top.openkylin.kylin-camera
  name: kylin-camera
  version: 1.3.0.16-ok1.67k0.20
  kind: app
command:
  - kylin-camera
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  net:
    network: true
  device:
    bluetooth: true
    microphone: true
    camera: true
    usb: true
    serial: true
  others:
    system-notice: true
    system-time: true
    system-server: true
    prevent-sleep: true
    system-display-resolution: true
    system-display-brightness: true
    system-audio-settings: true
    system-audio-size: true
    system-crontab: true
    system-power-mode: true
    system-power-policy: true
base: stable:top.openkylin.base/1.1.0
runtime: stable:top.openkylin.ukui/1.1.1
depends:
  - depend.openkylin.libcanberra-dev/0.30.0
  - depend.openkylin.libkf5windowsystem-dev/5.92.0
  - depend.openkylin.libgpac4/2.2.1-dfsg1.ok2k0.1
  - depend.openkylin.kylincameralibs/1.0.0.1-0k0.39
cleanup:
  []
annotations:
  kylin.depend-apps:
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
components:
  - name: kylin-camera
    buildsystem: simple
    build-script: "test -f kylin-camera.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.kylin-camera/files/bin/kylin-camera#' kylin-camera.desktop  && echo \\\"替换成功\\\" || echo \\\"错误:文件不存在或替换失败\\\" &&qmake kylin_camera.pro  CONFIG+=KAIMING   && make -j 2 && make install   && glib-compile-schemas /opt/apps/top.openkylin.kylin-camera/files/share/glib-2.0/schemas/ "
    sources:
      - type: dir
        path: .