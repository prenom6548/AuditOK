version: 1
package:
  id: top.openkylin.kylin-calculator
  name: kylin-calculator
  version: 1.2.0.0-ok6.15k0.44
  kind: app
command:
  - kylin-calculator
channel: stable
permission:
  filesystem:
    filesystem-dirs:
      - "~"
  net:
    network: true
    scanning: true
  device:
    bluetooth: true
    microphone: true
    camera: true
    usb: true
    serial: true
  processManager:
    autostart: true
  others:
    system-notice: true
    system-time: true
    system-server: true
    prevent-sleep: true
    system-display-resolution: true
    system-display-brightness: true
    system-audio-settings: true
    system-audio-size: true
    system-crontab: true
    system-power-mode: true
    system-power-policy: true
base: stable:top.openkylin.base/1.1.13
runtime: stable:top.openkylin.ukui/1.1.42
depends:
  - depend.openkylin.libgsl-dev
  - depend.openkylin.libkf5windowsystem-dev
cleanup:
  []
annotations:
  kylin.depend-apps:
    - /usr/lib/kylin-os-manager/bin/service-support-mini
    - /opt/kylin-os-manager/tools/service-support-mini
  kylin.gpu: true
components:
  - name: kylin-calculator
    buildsystem: simple
    build-script: "test -f kylin-calculator.desktop && sed -i 's#^Exec=.*$#Exec=/opt/apps/top.openkylin.kylin-calculator/files/bin/kylin-calculator#' kylin-calculator.desktop && echo \"替换成功\" || echo \"错误:文件不存在或替换失败\" && qmake kylin-calculator.pro CONFIG+=KAIMING && make -j 2 && make install"
    sources:
      - type: dir
        path: ..
