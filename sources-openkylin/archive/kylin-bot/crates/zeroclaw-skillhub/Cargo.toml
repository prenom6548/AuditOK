[package]
name = "zeroclaw-skillhub"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ZeroClaw SkillHub skill marketplace client"
repository = "https://github.com/zeroclaw-labs/zeroclaw"
publish = false
rust-version = "1.87"

[dependencies]
anyhow = "1.0"
colored = "2.1"
flate2 = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.26"
toml = "1.0"
tokio = { version = "1.50", default-features = false, features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "time",
] }
url = "2.5"
urlencoding = "2.1"
zip = { version = "8.1", default-features = false, features = [
  "deflate-flate2",
] }
