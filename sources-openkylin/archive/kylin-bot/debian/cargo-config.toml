# Debian/sbuild: use a domestic sparse index instead of crates.io directly.
# See https://mirrors.tuna.tsinghua.edu.cn/help/crates.io-index/

[source.crates-io]
replace-with = "mirror"

[source.mirror]
registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

[registries.mirror]
index = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

[net]
retry = 5
git-fetch-with-cli = true

# Must live here: dpkg-buildpackage sanitizes RUSTFLAGS from the caller.
# embed-bitcode=yes (rustc default) makes cc/cmake emit LLVM bitcode for
# sqlite3/aws-lc; Kylin GNU ld 2.41 cannot link those objects.
# Keep flags stable-only (`+linker` needs -Z unstable-options on rustc 1.96).
[build]
rustflags = ["-C", "embed-bitcode=no"]
