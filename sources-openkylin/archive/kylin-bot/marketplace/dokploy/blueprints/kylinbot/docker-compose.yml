version: "3.8"
services:
  kylinbot:
    image: ghcr.io/kylinbot/kylinbot:0.7.4
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY}
      - PROVIDER=${PROVIDER:-openrouter}
      - KYLINBOT_ALLOW_PUBLIC_BIND=true
      - KYLINBOT_GATEWAY_PORT=42617
    volumes:
      - kylinbot-data:/kylinbot-data
    expose:
      - 42617
volumes:
  kylinbot-data: {}
