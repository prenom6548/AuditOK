[package]
name = "wget-rust"
version = "0.1.0"
edition = "2021"
default-run = "wget"
# 与平台源常见 rustc/cargo 1.75 对齐；勿改回 2024（需 Rust ≥1.85 的 Cargo）。
rust-version = "1.75"

# 构建产物名为 `wget`（与系统命令一致）；crate 包名仍为 wget-rust。
[[bin]]
name = "wget"
path = "src/main.rs"

[dependencies]
# 4.5+ 可能拉取 clap_lex 等待 edition2024 的子 crate；锁定在 Cargo 1.75 可解析的版本。
clap = { version = "=4.4.18", features = ["derive"] }
reqwest = { version = "=0.12.4", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip", "brotli", "deflate", "stream", "cookies"] }
bytes = "=1.5.0"
tokio = { version = "=1.38.0", features = ["rt-multi-thread", "macros", "time"] }
rustls = { version = "=0.22.4", default-features = false, features = ["ring", "tls12"] }
tokio-rustls = "=0.25.0"
x509-parser = "=0.16.0"
url = "=2.4.1"
futures-util = "=0.3.31"
scraper = { version = "=0.18.1", default-features = false }
chrono = { version = "=0.4.31", default-features = false, features = ["clock", "std"] }
# 0.22+ 依赖 time ^0.3.47 → 拉取 time-core 0.1.8（edition2024），Cargo 1.75 无法解析。
cookie_store = "0.21"
cookie = "0.18"
# 与 Cargo 1.75 兼容：禁止解析到 time-core 0.1.8（其 manifest 需 edition2024）。
time = { version = "=0.3.36", default-features = false, features = ["std"] }
regex = "=1.10.3"
globset = "=0.4.14"
filetime = "=0.2.23"
percent-encoding = "=2.3.1"
encoding_rs = "0.8"
idna = "=1.1.0"
# 仅用于把 publicsuffix 锁在旧版，避免拉新版 idna 链。
publicsuffix = "=2.2.3"
# 强制使用仍兼容 Cargo 1.75 manifest 解析的旧版（若不存在会报版本冲突）。
idna_adapter = "=1.0.0"
indexmap = "=2.2.6"
# reqwest 链上的压缩：0.4.40+ 声明 rustc 1.83+。
async-compression = "=0.4.17"
