<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->
<!DOCTYPE busconfig PUBLIC
    "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <!-- Only root can own the service -->
    <policy user="root">
        <allow own="org.ukui.serviceManager"/>
    </policy>

    <!-- Allow anyone to invoke methods on the interfaces -->
    <policy context="default">
        <allow own="org.ukui.serviceManager"/>
        <allow send_destination="org.ukui.serviceManager"/>

        <allow send_destination="org.ukui.serviceManager"
            send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination="org.ukui.serviceManager"
            send_interface="org.freedesktop.DBus.Properties"/>
        <allow send_destination="org.ukui.serviceManager"
            send_interface="org.freedesktop.DBus.Properties"/>
    </policy>

    <!-- Only root can own the service -->
    <policy user="root">
        <allow own="org.ukui.serviceManager.Register"/>
    </policy>

    <!-- Allow anyone to invoke methods on the interfaces -->
    <policy context="default">
        <allow own="org.ukui.serviceManager.Register"/>
        <allow send_destination="org.ukui.serviceManager.Register"/>

        <allow send_destination="org.ukui.serviceManager.Register"
            send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination="org.ukui.serviceManager.Register"
            send_interface="org.freedesktop.DBus.Properties"/>
        <allow send_destination="org.ukui.serviceManager.Register"
            send_interface="org.freedesktop.DBus.Properties"/>
    </policy>

    <!-- Only root can own the service -->
    <policy user="root">
        <allow own="org.ukui.serviceManager.Launcher"/>
    </policy>

    <!-- Allow anyone to invoke methods on the interfaces -->
    <policy context="default">
        <allow own="org.ukui.serviceManager.Launcher"/>
        <allow send_destination="org.ukui.serviceManager.Launcher"/>

        <allow send_destination="org.ukui.serviceManager.Launcher"
            send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination="org.ukui.serviceManager.Launcher"
            send_interface="org.freedesktop.DBus.Properties"/>
        <allow send_destination="org.ukui.serviceManager.Launcher"
            send_interface="org.freedesktop.DBus.Properties"/>
    </policy>

    <!-- Only root can own the service -->
    <policy user="root">
        <allow own_prefix="org.ukui.Service"/>
    </policy>

    <!-- Allow anyone to invoke methods on the interfaces -->
    <policy context="default">
        <allow own_prefix="org.ukui.Service"/>
        <allow send_destination_prefix="org.ukui.Service"/>

        <allow send_destination_prefix="org.ukui.Service"
            send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination_prefix="org.ukui.Service"
            send_interface="org.freedesktop.DBus.Properties"/>
        <allow send_destination_prefix="org.ukui.Service"
            send_interface="org.freedesktop.DBus.Properties"/>
    </policy>
</busconfig>
