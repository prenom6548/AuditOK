# Lightweight package-list profile dependencies.
#
# Format:
#   profile: dependency dependency ...
#
# Each profile automatically includes package-lists/<profile>.list when that
# file exists. Dependencies are expanded before the profile's own list.

base:
server: base
normal: base

qemu-riscv64:
amd64:
iso-live:

server-qemu-riscv64.img: server qemu-riscv64
normal-qemu-riscv64.img: normal qemu-riscv64
server-amd64.iso: server amd64 iso-live
