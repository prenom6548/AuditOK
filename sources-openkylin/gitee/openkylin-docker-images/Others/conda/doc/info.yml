name: conda
category: others
category_zh: 其他
description: "Conda 是一个开源的软件包管理系统和环境管理系统，用于安装多个版本的软件包及其依赖项，并可在它们之间轻松切换。Miniforge 是首选的 conda-forge 安装程序，其中包含 conda、mamba 及其依赖项。"
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  Go镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[25.9.1-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Others/conda/25.9.1/2.0/Dockerfile) | conda 25.9.1 on openKylin 2.0 | amd64,arm64,riscv64 |
  
  注意，以下`{Tag}`的值按照需求，替换为上述表格中的tag内容。

download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/conda:{Tag}
  # From Quay
  docker pull quay.io/openkylin/conda:{Tag}
  ```

usage: |
  `openkylin/conda:{Tag}`可以作为开发和构建环境使用：
  - 启动容器
    ```bash
	  docker run -d --name my-conda openkylin/conda:{Tag} bash
	  ```
  - 使用示例
    ```bash
    conda list
    ```   
