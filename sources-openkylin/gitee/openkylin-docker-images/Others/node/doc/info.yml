name: node
category: others
category_zh: 其他
description: Node.js 是一个基于 V8 JavaScript 引擎 的开源运行时环境，可以让你在 服务器端 运行 JavaScript 代码。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  node镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |---------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------|---------------|
  |[22.21.1-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Others/node/22.12.1/2.0/Dockerfile) | node 22.21.1 on openKylin 2.0 | amd64,arm64,riscv64 |
  |[24.14.1-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Others/node/24.14.1/2.0/Dockerfile) | node 24.14.1 on openKylin 2.0 | amd64,arm64,riscv64 |

download: |
  拉取镜像到本地
  ```
  docker pull openkylin/node:{Tag}
  ```

usage: |
  - 以交互式Shell运行容器:

    通过交互式 Shell 启动容器，使用node命令：
    ```
    docker run -it --rm openkylin/node:{Tag} bash
    ```
 
  - 运行简单的 JavaScript 文件
    
    创建一个 hello.js 文件，内容如下：
    ```
    // hello.js
    console.log("Hello, Node.js!");
    ```
  
    然后在终端执行：
    ```
    node hello.js
    ```
  
    输出:
    ```
    Hello, Node.js!
    ```

