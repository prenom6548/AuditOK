name: dotnet-sdk
category: others
category_zh: 其他
description: Dotnet SDK (.NET SDK)是一个运行时环境，用于执行基于.NET平台的应用程序。它提供了必要的组件和功能，使得.NET应用程序能够在特定的操作系统上运行。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  dotnet-sdk镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[10.0.101-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Others/dotnet-sdk/10.0.101/2.0/Dockerfile) | dotnet 10.0.101 on openKylin 2.0 | amd64,arm64,riscv64 |

download: |
  拉取镜像到本地
  ```
  docker pull openkylin/dotnet-sdk:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run -d --name my-dotnet-sdk openkylin/dotnet-sdk:{Tag}
    ```
    用户可根据自身需求选择对应版本的{Tag}、容器启动的选项。`my-dotnet-sdk`启动之后，通过`http://localhost:8080`访问服务。
  
  - 使用示例

    以HelloWorld应用为例说明该容器镜像使用方法
    1. 创建HelloWorld.csproj文件并填入以下内容
        ```
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <TargetFramework>net{x.x}</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
          </PropertyGroup>
        </Project>
        ```
        注意，上面`{x.x}`需要替换成相应的dotnet版本号。

    2. 创建Program.cs文件并填入以下内容
        ```
        Console.WriteLine("Hello, World!");
        ```

    3. 发布应用
        ```
        dotnet publish -c Release -o /app
        ```
        执行过程会出现以下关键信息：
        ```
        Determining projects to restore...
        Restored /tmp/demo/HelloWorld.csproj (in 59 ms).
        HelloWorld -> /tmp/demo/bin/Release/net{x.x}/HelloWorld.dll
        HelloWorld -> /tmp/demo/bin/Release/net{x.x}/publish/
        ```

    4. 使用`openkylin/dotnet-sdk:{Tag}`运行该应用
        ```
        docker run --rm -v $PWD/app:/app openkylin/dotnet-sdk:{Tag} /app/HelloWorld.dll 
        ```
        注意，发布应用使用的dotnet版本`{x.x}`必须和`{Tag}`所指向的dotnet版本一致。

  - 容器测试

    查看运行日志
    ```
    docker logs -f my-dotnet-sdk
    ```

    运行启动shell会话
    ```
    docker run -it --entrypoint /bin/bash --name my-dotnet-sdk openkylin/dotnet-sdk:{Tag}
    ```

