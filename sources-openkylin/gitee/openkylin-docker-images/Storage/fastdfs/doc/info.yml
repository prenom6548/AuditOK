name: fastdfs
category: storage
category_zh: 存储
description: FastDFS（Fast Distributed File System） 是一个开源的轻量级分布式文件存储系统，由国内开发者余庆开发，主要用于解决大容量文件存储和高并发访问的问题。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  fastdfs镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[6.15.2-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Storage/fastdfs/6.15.2/2.0/Dockerfile) | fastdfs 6.15.2 on openKylin 2.0 | amd64,arm64,riscv64 |


download: |
  拉取镜像到本地
  ```
  docker pull openkylin/fastdfs:{Tag}
  ```

usage: |
  - 使用交互式 Shell 启动容器

    交互式 shell 启动容器来运行 fastdfs：
    ```
    docker run -it --rm openkylin/fastdfs:{Tag} bash
    ```

  - 启动Tracker服务器

    ```
    fdfs_trackerd /etc/fdfs/tracker.conf start
    ```
    验证Tracker是否运行：
    ```
    ps aux | grep fdfs_trackerd
    ```

  - 启动Storage服务器

    将配置文件`/etc/fdfs/storage.conf`中的`tracker_server`修改为本地容器IP。
    ```
    fdfs_storaged /etc/fdfs/storage.conf start
    ```
    验证Storage是否运行：
    ```
    ps aux | grep fdfs_storaged
    ```
  
  - 监控集群状态
   
    将配置文件`/etc/fdfs/client.conf`中的`tracker_server`修改为本地容器IP。
    ```
    fdfs_monitor /etc/fdfs/client.conf
    ```
    预期输出应显示：
    ```
    Storage 1:
        id = 172.17.0.2
        ip_addr = 172.17.0.2  ACTIVE
    ```
  
  - 测试文件上传

    ```
    # 创建测试文件
    echo "Hello FastDFS" > test.txt
  
    # 上传文件
    fdfs_test /etc/fdfs/client.conf upload test.txt
    ```

