name: flannel
category: cloud
category_zh: 云服务
description: flannel 是一个为容器设计的网络 fabric，专为 Kubernetes 而设计。

environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```

tags: |
  docker镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.27.4-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Cloud/flannel/0.27.4/2.0/Dockerfile) | flannel 0.27.4 on openKylin 2.0 | amd64,arm64,riscv64 |

download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/flannel:{Tag}
  # From Quay
  docker pull quay.io/openkylin/flannel:{Tag}
  ```

usage: |
  - 启动flannel实例

    ```
    docker run -it --name flannel openkylin/flannel:{Tag}
    ```
    `openkylin/flannel`镜像用于验证上游flannel版本和openKylin的集成。

