name: libvirt
category: cloud
category_zh: 云服务
description: libvirt 是一个开源的虚拟化管理工具和API框架，用于管理和控制各种虚拟化技术，包括 KVM、QEMU、Xen、LXC 等。

environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```

tags: |
  libvirt镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[11.9.0-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Cloud/libvirt/11.9.0/2.0/Dockerfile) | libvirt 11.9.0 on openKylin 2.0 | amd64,arm64,riscv64 |

download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/libvirt:{Tag}
  # From Quay
  docker pull quay.io/openkylin/libvirt:{Tag}
  ```

usage: |
  - 启动libvirt实例

    ```
    docker run -it --name libvirt openkylin/libvirt:{Tag}
    ```
    `openkylin/libvirt`镜像用于验证上游libvirt版本和openKylin的集成。
  

