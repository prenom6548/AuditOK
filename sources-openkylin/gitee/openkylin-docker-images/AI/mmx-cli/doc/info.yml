name: mmx-cli
category: AI
category_zh: 人工智能
description: MiniMax AI 开放平台官方命令行工具。专为 AI Agent 打造。在任意 Agent 或终端中生成文字、图像、视频、语音和音乐。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  Minimax Cli 镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.0.5-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/AI/mmx-cli/1.0.5/2.0/Dockerfile)| Minimax Cli 1.0.5  on openKylin 2.0 | amd64,arm64,riscv64 |
download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/mmx-cli:{Tag}
  # From Quay
  docker pull quay.io/openkylin/mmx-cli:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run -it --name my-mmx openkylin/mmx-cli:{Tag} 
    ```
  
  - 启动参数

    |    Parameter   |  Description  |
    |----------------|---------------|
    | `--name my-mmx` | 容器命名为 `my-mmx`. |
    | `-it` | 以交互模式并结合终端启动容器 (bash). |
    | `openkylin/mmx-cli:{Tag}` | 指定要运行的 Docker 镜像，将{Tag}替换为你想要使用的openkylin/mmx-cli镜像的具体版本或标签。 |

  - 运行 MiniMax Cli

    ```bash
    mmx
    ```

