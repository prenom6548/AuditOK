name: codewhale
category: AI
category_zh: 人工智能
description: 面向 DeepSeek V4 的终端原生编程智能体：100 万 token 上下文、思考模式流式推理、前缀缓存感知。以 codewhale 调度器和 codewhale-tui 运行时这一组自包含 Rust 二进制发布——开箱即带 MCP 客户端、沙箱和持久化任务队列。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  CodeWhale 镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.8.51-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/AI/codewhale/0.8.51/2.0/Dockerfile)| CodeWhale 0.8.51  on openKylin 2.0 | amd64,arm64,riscv64 |
download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/codewhale:{Tag}
  # From Quay
  docker pull quay.io/openkylin/codewhale:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run -it --name my-codewhale openkylin/codewhale:{Tag} 
    ```
  
  - 启动参数

    |    Parameter   |  Description  |
    |----------------|---------------|
    | `--name my-codewhale` | 容器命名为 `my-codewhale`. |
    | `-it` | 以交互模式并结合终端启动容器 (bash). |
    | `openkylin/codewhale:{Tag}` | 指定要运行的 Docker 镜像，将{Tag}替换为你想要使用的openkylin/codewhale镜像的具体版本或标签。 |

  - 运行 CodeWhale

    ```bash
    codewhale
    ```

