name: atomcode
category: AI
category_zh: 人工智能
description: Claude Code 的开源替代方案。连接任意大模型，编辑代码，运行命令，自动验证 — 全自动执行。用 Rust 构建，极致性能。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  AtomCode 镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[4.20.4-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/AI/atomcode/4.20.4/2.0/Dockerfile)| AtomCode 4.20.4 on openKylin 2.0 | amd64,arm64,riscv64 |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/atomcode:{Tag}
  # From Quay
  docker pull quay.io/openkylin/atomcode:{Tag}
  ```

download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/atomcode:{Tag}
  # From Quay
  docker pull quay.io/openkylin/atomcode:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run -it --name my-atomcode openkylin/atomcode:{Tag} 
    ```
  
  - 启动参数

    |    Parameter   |  Description  |
    |----------------|---------------|
    | `--name my-atomcode` | 容器命名为 `my-atomcode`. |
    | `-it` | 以交互模式并结合终端启动容器 (bash). |
    | `openkylin/atomcode:{Tag}` | 指定要运行的 Docker 镜像，将{Tag}替换为你想要使用的openkylin/atomcode镜像的具体版本或标签。 |

  - 运行 AtomCode

    ```bash
    atomcode
    ```

