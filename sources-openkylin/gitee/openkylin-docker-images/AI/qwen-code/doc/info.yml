name: qwen-code
category: AI
category_zh: 人工智能
description: Qwen Code 是一款开源的终端 AI 智能体，专为 Qwen 系列模型优化。它能帮助你理解大型代码库、自动化繁琐工作，加速交付。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  Qwen Code镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.12.6-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/AI/qwen-code/0.12.6/2.0/Dockerfile)| Qwen-Code 0.12.6  on openKylin 2.0 | amd64,arm64,riscv64 |
download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/qwen-code:{Tag}
  # From Quay
  docker pull quay.io/openkylin/qwen-code:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run -it --name my-qwen openkylin/qwen-code:{Tag} 
    ```
  
  - 启动参数

    |    Parameter   |  Description  |
    |----------------|---------------|
    | `--name my-qwen` | 容器命名为 `my-qwen`. |
    | `-it` | 以交互模式并结合终端启动容器 (bash). |
    | `openkylin/qwen-code:{Tag}` | 指定要运行的 Docker 镜像，将{Tag}替换为你想要使用的openkylin/qwen-code镜像的具体版本或标签。 |

  - 运行 Qwen Code

    ```bash
    qwen
    ```

