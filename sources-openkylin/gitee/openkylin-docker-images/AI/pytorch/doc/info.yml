name: pytorch
category: ai
description: PyTorch是一个开源的Python机器学习库，基于torch，用于自然语言处理等应用程序。PyTorch既可以看作加入了GPU支持的numpy，同时也可以看成一个拥有自动求导功能的强大的深度神经网络。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  PyTorch镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[2.6.0-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/AI/pytorch/2.6.0/2.0/Dockerfile)| PyTorch 2.6.0 on openKylin 2.0 | arm64,amd64,riscv64 |
  |[2.11.0-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/AI/pytorch/2.11.0/2.0/Dockerfile)| PyTorch 2.11.0 on openKylin 2.0 | arm64,amd64,riscv64 |
  |[2.12.0-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/AI/pytorch/2.12.0/2.0/Dockerfile)| PyTorch 2.12.0 on openKylin 2.0 | arm64,amd64,riscv64 |

download: |
  拉取镜像到本地
  ```
  docker pull openkylin/pytorch:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run \
        --name my-pytorch \
        -it openkylin/pytorch:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的{Tag}以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-pytorch` | 容器名称。|
    | `-it` | 以交互模式启动容器。 |
    | `openkylin/pytorch:{Tag}` | 指定要运行的镜像为 `openkylin/pytorch`，其中` {Tag}` 是需要替换的镜像标签。 |

  - 容器测试

    查看运行日志
    ```
    docker logs -f my-pytorch
    ```

