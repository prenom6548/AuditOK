name: gemini-cli
category: AI
category_zh: 人工智能
description: 借助 AI 进行构建、调试与部署，查询并编辑大型代码库，通过图像或 PDF 生成应用程序，以及自动化复杂工作流——这一切，皆可通过 Gemini 3 直接在终端中完成。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  Gemini Cli 镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.36.0-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/AI/gemini-cli/0.36.0/2.0/Dockerfile)| Gemini Cli 0.36.0  on openKylin 2.0 | amd64,arm64,riscv64 |
download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/gemini-cli:{Tag}
  # From Quay
  docker pull quay.io/openkylin/gemini-cli:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run -it --name my-gemini openkylin/gemini-cli:{Tag} 
    ```
  
  - 启动参数

    |    Parameter   |  Description  |
    |----------------|---------------|
    | `--name my-gemini` | 容器命名为 `my-gemini`. |
    | `-it` | 以交互模式并结合终端启动容器 (bash). |
    | `openkylin/gemini-cli:{Tag}` | 指定要运行的 Docker 镜像，将{Tag}替换为你想要使用的openkylin/gemini-cli镜像的具体版本或标签。 |

  - 运行 Gemini Cli

    ```bash
    gemini
    ```

