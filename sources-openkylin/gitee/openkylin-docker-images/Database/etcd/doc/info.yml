name: etcd
category: database
category_zh: 数据库
description: Etcd 是一个分布式键值存储，旨在跨集群安全地存储数据。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```

tags: |
  etcd镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[3.6.6-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Database/etcd/3.6.6/2.0/Dockerfile)| Etcd 3.6.0 on openKylin 2.0 | amd64,arm64,riscv64 |

download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/etcd:{Tag}
  # From Quay
  docker pull quay.io/openkylin/etcd:{Tag}
  ```

usage: |
  
  - 创建docker网络

    ```bash
    docker network create app-tier --driver bridge
    ```

  - 启动Etcd server实例

    使用 `--network app-tier` 参数来执行 `docker run` 命令
    ```
    docker run -d --name Etcd-server \
      --network app-tier \
      --publish 2379:2379 \
      --publish 2380:2380 \
      --env ALLOW_NONE_AUTHENTICATION=yes \
      --env ETCD_ADVERTISE_CLIENT_URLS=http://etcd-server:2379 \
      openkylin/etcd:{Tag}
    ```
  
