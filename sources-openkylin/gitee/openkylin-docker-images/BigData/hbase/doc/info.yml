name: hbase
category: bigdata
category_zh: 大数据
description: Apache HBase 是一个开源、分布式、版本化、面向列的存储系统，以 Google 的 Bigtable 为蓝本。

environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```

tags: |
  hbase镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  | Tags | Currently |  Architectures|
  |------|-----------|---------------|
  |[2.6.4-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Bigdata/hbase/2.6.4/2.0/Dockerfile)| Apache HBase 2.6.4 on openKylin 2.0 | amd64,arm64,riscv64 |

download: |
  拉取镜像到本地
  ```
  docker pull openkylin/hbase:{Tag}
  ```

usage: |
  - 启动容器

    ```bash
    docker run -it \
      --name hbase \
      openkylin/hbase:{Tag}
    ```

