name: spark
category: bigdata
category_zh: 大数据
description: spark是一个通用的并行计算框架，由加州伯克利大学的AMP于2009开发，并于2010年进行开源，后续发展为大数据领域的最活跃的开源项目之一。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```

tags: |
  spark镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[4.0.1-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/Bigdata/spark/4.0.1/2.02/Dockerfile) | spark 4.0.1 on openKylin 2.0 | amd64,arm64,riscv64 |
  
download: |
  拉取镜像到本地
  ```
  # From Docker Hub
  docker pull openkylin/spark:{Tag}
  # From Quay.io
  docker pull quay.io/openkylin/spark:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run -d --name my-spark openkylin/spark:{Tag}
    ```
  用户可根据自身需求选择对应版本的{Tag}、容器启动的选项。

  - 容器测试

    查看运行日志
    ```
    docker logs -f my-spark
    ```

    使用shell交互
    ```
    docker exec -it my-spark /bin/bash
    ```

