name: lammps
category: HPC
category_zh: 高性能计算
description: LAMMPS（全称：Large-scale Atomic/Molecular Massively Parallel Simulator）是一款由美国桑迪亚国家实验室（Sandia National Laboratories）主导开发的开源分子动力学（MD）模拟软件。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  lammps镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  | [22Jul2025-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/HPC/lammps/22Jul2025/2.0/Dockerfile) | lammps 22Jul2025 on openKylin 2.0 | amd64,arm64,riscv64  |
download: |
  拉取镜像到本地
  ```
  # From Docker Hub
	docker pull openkylin/lammps:{Tag}
  # From Quay
  docker pull quay.io/openkylin/lammps:{Tag}
  ```

usage: |
  - 启动lammps实例

    ```
    docker run -it --name lammps openkylin/lammps:{Tag}
    ```
    `openkylin/lammps`镜像用于验证上游lammps版本和openKylin的集成。
  

