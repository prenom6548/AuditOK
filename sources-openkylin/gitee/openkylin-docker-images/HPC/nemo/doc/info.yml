name: nemo
category: HPC
category_zh: 高性能计算
description: Nemo 是 Linux 系统上的一款 图形化文件管理器，由 Cinnamon 桌面环境 开发团队维护。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  apt install -y docker.io
  ```
tags: |
  nemo镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[6.6.2-ok20](https://gitee.com/openkylin/openkylin-docker-images/blob/master/HPC/nemo/6.6.2/2.0/Dockerfile) | nemo 6.6.2 on openKylin 2.0 | amd64,arm64,riscv64 |
download: |
  拉取镜像到本地
  ```
  # From Docker Hub
	docker pull openkylin/nemo:{Tag}
  # From Quay
  docker pull quay.io/openkylin/nemo:{Tag}
  ```

usage: |
  - 启动nemo实例

    ```
    docker run -it --name nemo openkylin/nemo:{Tag}
    ```
    `openkylin/nemo`镜像用于验证上游nemo版本和openKylin的集成。
  

