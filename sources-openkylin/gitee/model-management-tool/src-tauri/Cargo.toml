[package]
name = "model-management-tool"
version = "1.0.1"
description = "AI model management tool"
authors = ["openKylin"]
edition = "2021"

[lib]
name = "model_management_tool"
path = "src/lib.rs"

[[bin]]
name = "model-management-tool"
path = "src/main.rs"

# tauri-v1/tauri-v2 features 仅用于源码中按系统版本切换 Tauri API，
# Tauri 1 的实际依赖见 ../src-tauri-v1（gtk-sys links 冲突导致两个版本无法共存于同一依赖图）。
[features]
default = ["tauri-v2"]
tauri-v1 = []
tauri-v2 = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
futures-util = "0.3"
fs2 = "0.4"
dirs = "6"

# 自建模态文件对话框（src/dialogs.rs），版本需与 tauri 2 使用的 gtk 一致
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[dev-dependencies]
tempfile = "3"
