# 麒麟 V10 专用构建入口（Tauri 1）。
# 源码与 src-tauri 共享，通过 tauri-v1 feature 选择 Tauri 1 代码路径；
# 与 src-tauri 分开为独立 crate 是因为 tauri 1（gtk 0.15）与 tauri 2（gtk 0.18）
# 依赖的 gtk-sys links 冲突，无法共存于同一依赖图。
[package]
name = "model-management-tool"
version = "1.0.1"
description = "AI model management tool"
authors = ["openKylin"]
edition = "2021"

[features]
default = ["tauri-v1"]
tauri-v1 = []
tauri-v2 = []
# Tauri CLI 发布构建时自动启用
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "model_management_tool"
path = "../src-tauri/src/lib.rs"

[[bin]]
name = "model-management-tool"
path = "../src-tauri/src/main.rs"

[[test]]
name = "cloud"
path = "../src-tauri/tests/cloud.rs"

[[test]]
name = "packager_integration"
path = "../src-tauri/tests/packager_integration.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = ["window-all"] }
single-instance = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
futures-util = "0.3"
fs2 = "0.4"
dirs = "6"

# 自建模态文件对话框（src-tauri/src/dialogs.rs），版本需与 tauri 1 使用的 gtk 一致
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.15", features = ["v3_20"] }

[dev-dependencies]
tempfile = "3"
