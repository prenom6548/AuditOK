name: HygonDCU
description: The hygonDCU SIG mainly focuses on the Haiguang DCU (deep compute unit) acceleration card, presenting the Haiguang AI computing ecosystem. Based on the Haiguang DCU acceleration card's drivers, optimization models, optimization operators, DTK platform, etc., combined with openKylin's AI functions, it achieves a deep integration of AI PC from operating system to Haiguang DCU, improving and accelerating the ecosystem and computing efficiency of upper layer applications.
